<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>حکم آنلاین</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#0c0e1f; --bg2:#181c3a; --bg3:#1f2a52;
  --glass:rgba(255,255,255,.07); --glass-brd:rgba(255,255,255,.14);
  --ivory:#faf8f5; --ink:#181a22; --red:#e2506b;
  --violet:#8b93ff; --mint:#4fd9c5; --gold:#f2c57c;
  --me:#4fd9c5; --opp:#ff9d7a;
  --text:#eef0ff; --text-dim:#a9adcf;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{
  margin:0;overflow-x:hidden;font-family:Vazirmatn,Tahoma,sans-serif;color:var(--text);min-height:100vh;
  background:
    radial-gradient(circle at 12% 8%, rgba(139,147,255,.35), transparent 45%),
    radial-gradient(circle at 88% 18%, rgba(79,217,197,.25), transparent 50%),
    radial-gradient(circle at 50% 100%, rgba(242,197,124,.18), transparent 55%),
    linear-gradient(180deg,var(--bg1),var(--bg2) 55%,var(--bg3));
  background-attachment:fixed;
}
#app{max-width:480px;margin:0 auto;padding:14px 12px 30px;}
h2{text-align:center;margin:4px 0 14px;font-weight:900;letter-spacing:.2px;
  background:linear-gradient(90deg,var(--violet),var(--mint));
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.top{display:flex;align-items:center;justify-content:space-between;}
#muteBtn{width:42px;height:42px;padding:0;background:var(--glass);border:1px solid var(--glass-brd);
  backdrop-filter:blur(14px);color:#fff;font-size:18px;border-radius:14px;}

.panel{
  background:var(--glass);border:1px solid var(--glass-brd);backdrop-filter:blur(18px);
  border-radius:20px;padding:16px;margin-bottom:12px;
  box-shadow:0 8px 30px rgba(0,0,0,.25);
}
input,button{font-family:inherit;font-size:16px;border-radius:14px;border:none;padding:12px;}
input{width:100%;margin-bottom:10px;background:rgba(255,255,255,.06);color:var(--text);
  border:1px solid var(--glass-brd);}
input::placeholder{color:var(--text-dim);}
button{
  background:linear-gradient(135deg,var(--violet),var(--mint));
  color:#0c0e1f;font-weight:800;width:100%;cursor:pointer;
  box-shadow:0 6px 18px rgba(139,147,255,.35);transition:transform .15s;
}
button:active{transform:scale(.96);}
button:disabled{opacity:.35;box-shadow:none;}
.players li{margin:6px 0;color:var(--text);}
.status{text-align:center;margin:2px 0 10px;font-size:14px;color:var(--gold);min-height:20px;}

.opt-label{margin:0 0 6px;font-size:13px;color:var(--text-dim);}
.opt-row{display:flex;gap:8px;margin-bottom:4px;}
.opt-btn{flex:1;width:auto;background:var(--glass);border:1px solid var(--glass-brd);color:var(--text);
  font-weight:700;box-shadow:none;padding:10px;}
.opt-btn.active{background:linear-gradient(135deg,var(--violet),var(--mint));color:#0c0e1f;
  box-shadow:0 6px 18px rgba(139,147,255,.35);}

.score{display:flex;gap:8px;align-items:stretch;}
.chip{flex:1;border-radius:16px;padding:8px 8px;text-align:center;font-size:13px;
  background:var(--glass);border:1px solid var(--glass-brd);backdrop-filter:blur(14px);}
.chip b{display:block;font-size:20px;}
.chip.me{box-shadow:inset 0 0 0 1px rgba(79,217,197,.4);}
.chip.opp{box-shadow:inset 0 0 0 1px rgba(255,157,122,.4);}
.trumpbox{width:66px;border-radius:16px;background:var(--ivory);color:var(--ink);text-align:center;
  font-size:28px;line-height:1;padding-top:8px;box-shadow:0 6px 18px rgba(0,0,0,.3);}
.trumpbox small{display:block;font-size:11px;color:#777;margin-top:2px;}
.trumpbox.red{color:var(--red);}

.table{direction:ltr;display:grid;grid-template-columns:64px 1fr 64px;grid-template-rows:76px 210px 76px;
  grid-template-areas:". top ." "left felt right" ". bot .";gap:4px;margin:10px 0;}
.seat{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;gap:4px;}
.s0{grid-area:bot}.s1{grid-area:right}.s2{grid-area:top}.s3{grid-area:left}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:16px;
  color:#0c0e1f;position:relative;border:3px solid transparent;box-shadow:0 4px 14px rgba(0,0,0,.35);}
.av.t0{background:linear-gradient(135deg,var(--mint),#8ff0e2);}
.av.t1{background:linear-gradient(135deg,var(--opp),#ffc09e);}
.av.turn{border-color:var(--gold);animation:pulse 1.1s infinite;}
.av .crown{position:absolute;top:-15px;font-size:14px;}
.nm{max-width:64px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-dim);}

.felt{grid-area:felt;position:relative;border-radius:50%/42%;
  background:
    radial-gradient(ellipse at center, rgba(139,147,255,.16), rgba(79,217,197,.10) 60%, transparent 75%);
  border:1px solid var(--glass-brd);backdrop-filter:blur(10px);
  box-shadow:inset 0 0 40px rgba(0,0,0,.35), 0 10px 30px rgba(0,0,0,.3);}
#trick{position:absolute;inset:0;}

.card{background:var(--ivory);color:var(--ink);border-radius:11px;width:46px;height:66px;font-weight:900;
  position:relative;box-shadow:0 6px 16px rgba(0,0,0,.35);user-select:none;}
.card.red{color:var(--red);}
.card .r{position:absolute;top:4px;left:6px;font-size:15px;line-height:1;direction:ltr;}
.card .s{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;}
.card .r2{position:absolute;bottom:4px;left:6px;font-size:15px;line-height:1;direction:ltr;}
#trick .card{position:absolute;}
.tc0{left:calc(50% - 23px);bottom:8px;--dx:0;--dy:90px;}
.tc2{left:calc(50% - 23px);top:8px;--dx:0;--dy:-90px;}
.tc1{right:18px;top:calc(50% - 33px);--dx:90px;--dy:0;}
.tc3{left:18px;top:calc(50% - 33px);--dx:-90px;--dy:0;}
#trick .card.drop{animation:drop .35s ease-out;}

.hand{display:flex;justify-content:center;padding:10px 0 4px;min-height:86px;direction:ltr;}
.hand .card{margin-left:-14px;width:52px;height:76px;transition:transform .15s,box-shadow .15s;opacity:.5;}
.hand .card:first-child{margin-left:0;}
.hand.mine .card{opacity:1;cursor:pointer;}
.hand.mine .card:active{transform:translateY(-16px);box-shadow:0 12px 24px rgba(139,147,255,.4);}

.trump-picker{display:flex;gap:8px;}
.trump-picker button{background:var(--ivory);color:var(--ink);font-size:26px;padding:10px;
  box-shadow:0 6px 16px rgba(0,0,0,.3);}
.trump-picker button:nth-child(2),.trump-picker button:nth-child(3){color:var(--red);}

.hakem-hand{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:6px 0 18px;direction:ltr;}
.hakem-hand .card{width:74px;height:106px;box-shadow:0 10px 22px rgba(0,0,0,.45);}
.hakem-hand .card .r,.hakem-hand .card .r2{font-size:20px;}
.hakem-hand .card .s{font-size:38px;}

.chatbox{max-height:140px;overflow-y:auto;font-size:13px;margin-bottom:8px;color:var(--text-dim);}
.chatbox b{color:var(--text);}

.chat-fab{
  position:fixed;left:14px;bottom:18px;width:50px;height:50px;border-radius:50%;
  padding:0;font-size:20px;z-index:60;box-shadow:0 6px 18px rgba(139,147,255,.45);
}
.chat-popup{
  position:fixed;left:14px;bottom:76px;width:min(270px, calc(100vw - 28px));
  background:var(--bg2);border:1px solid var(--glass-brd);backdrop-filter:blur(18px);
  border-radius:16px;padding:10px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.45);
}
.chat-popup .chat-row{display:flex;gap:6px;}
.chat-popup .chat-row input{margin-bottom:0;flex:1;}
.chat-popup .chat-row button{width:auto;padding:12px 16px;}

.seat{position:relative;}
.bubble{
  position:absolute;max-width:110px;background:var(--ivory);color:var(--ink);
  border-radius:12px;padding:6px 9px;font-size:11.5px;font-weight:700;line-height:1.3;
  word-break:break-word;box-shadow:0 6px 16px rgba(0,0,0,.4);z-index:5;
}
.s0 .bubble{top:100%;left:50%;transform:translateX(-50%);margin-top:6px;}
.s2 .bubble{bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:6px;}
.s1 .bubble{top:100%;right:0;margin-top:6px;max-width:90px;}
.s3 .bubble{top:100%;left:0;margin-top:6px;max-width:90px;}

.round-end-title{text-align:center;font-size:20px;font-weight:900;margin:2px 0 14px;color:var(--gold);}
.round-end-cols{display:flex;gap:10px;}
.round-end-col{flex:1;border-radius:16px;padding:12px 8px;text-align:center;
  background:var(--glass);border:1px solid var(--glass-brd);}
.round-end-col.win{box-shadow:inset 0 0 0 1px rgba(79,217,197,.5);}
.round-end-col.lose{box-shadow:inset 0 0 0 1px rgba(255,157,122,.4);}
.round-end-col h4{margin:0 0 8px;font-size:13px;color:var(--text-dim);}
.round-end-col div{font-size:15px;font-weight:700;margin:3px 0;}

@keyframes drop{from{transform:translate(var(--dx),var(--dy)) scale(1.2);opacity:0;}to{transform:none;opacity:1;}}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(242,197,124,.35);}}
/* ---- انیمیشن پخش کارت ---- */
.card-back{border-radius:11px;border:2px solid var(--ivory);
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.14) 0 4px,transparent 4px 8px),
    linear-gradient(135deg,var(--violet),#5560d6 60%,var(--mint));
  box-shadow:0 6px 16px rgba(0,0,0,.4);}
#dealLayer{position:fixed;inset:0;pointer-events:none;z-index:55;overflow:hidden;}
#dealLayer .deal-card,#dealLayer .deal-deck i{position:absolute;left:0;top:0;width:52px;height:76px;will-change:transform,opacity;}
#dealLayer .deal-deck{position:absolute;width:52px;height:76px;transform:scale(.72);}
.hakem-hand .card{animation:dealIn .45s cubic-bezier(.2,.8,.3,1) backwards;animation-delay:calc(var(--i,0)*90ms);}
@keyframes dealIn{from{transform:translateY(-140px) rotate(-14deg) scale(.6);opacity:0;}to{transform:none;opacity:1;}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>
<audio id="bgMusic" loop preload="auto" src="Toneloom%20Violin%20UpMusics.mp3"></audio>
<div id="dealLayer"></div>
<div id="app">
  <div class="top"><span style="width:40px"></span><h2>🃏 حکم آنلاین</h2><button id="muteBtn" onclick="toggleMute()">🔊</button></div>
  <div id="screen-name" class="panel">
    <p>اسم شما در بازی:</p>
    <input id="nameInput" placeholder="اسمت رو بنویس">
    <button onclick="proceedFromName()">ادامه</button>
  </div>
  <div id="screen-lobby-choice" class="panel" style="display:none">
    <p class="opt-label">تعداد بازیکن‌ها:</p>
    <div class="opt-row">
      <button type="button" class="opt-btn" data-players="2" onclick="selectPlayers(2)">۲ نفره</button>
      <button type="button" class="opt-btn active" data-players="4" onclick="selectPlayers(4)">۴ نفره</button>
    </div>
    <p class="opt-label" style="margin-top:12px">بازی تا چند مچ؟</p>
    <div class="opt-row">
      <button type="button" class="opt-btn" data-score="3" onclick="selectScore(3)">۳ مچ</button>
      <button type="button" class="opt-btn" data-score="5" onclick="selectScore(5)">۵ مچ</button>
      <button type="button" class="opt-btn active" data-score="7" onclick="selectScore(7)">۷ مچ</button>
    </div>
    <button onclick="createRoom()" style="margin-top:14px">➕ ساخت اتاق جدید</button>
    <input id="joinCodeInput" placeholder="کد اتاق (برای پیوستن)" style="margin-top:10px">
    <button onclick="joinRoom()">🔗 پیوستن به اتاق</button>
  </div>
  <div id="screen-lobby" class="panel" style="display:none">
    <p>کد اتاق: <b id="roomCodeText" style="font-size:22px;color:var(--gold)"></b></p>
    <p id="lobbyInfo"></p>
    <ul id="playersList" class="players"></ul>
    <button id="startBtn" onclick="startGame()" style="display:none">▶️ شروع بازی</button>
  </div>
  <div id="screen-trump" class="panel" style="display:none">
    <p id="trumpMsg"></p>
    <div class="hakem-hand" id="trumpHandArea" style="display:none"></div>
    <div class="trump-picker">
      <button onclick="chooseTrump('♠')">♠</button>
      <button onclick="chooseTrump('♥')">♥</button>
      <button onclick="chooseTrump('♦')">♦</button>
      <button onclick="chooseTrump('♣')">♣</button>
    </div>
  </div>
  <div id="screen-game" style="display:none">
    <div class="score">
      <div class="chip me">ما<b id="scMe">0</b><span id="trMe"></span></div>
      <div class="trumpbox" id="trumpBox"><span id="trumpDisplay"></span><small>حکم</small></div>
      <div class="chip opp">حریف<b id="scOpp">0</b><span id="trOpp"></span></div>
    </div>
    <div class="status" id="turnStatus"></div>
    <div class="table">
      <div class="seat s2" id="seat2"></div>
      <div class="seat s3" id="seat3"></div>
      <div class="felt"><div id="trick"></div></div>
      <div class="seat s1" id="seat1"></div>
      <div class="seat s0" id="seat0"></div>
    </div>
    <div class="hand" id="handArea"></div>
  </div>
  <div id="screen-round-end" class="panel" style="display:none">
    <p class="round-end-title" id="roundEndTitle"></p>
    <div class="round-end-cols">
      <div class="round-end-col win">
        <h4>🏆 برنده‌های این دست</h4>
        <div id="roundEndWinners"></div>
      </div>
      <div class="round-end-col lose">
        <h4>بازنده‌های این دست</h4>
        <div id="roundEndLosers"></div>
      </div>
    </div>
  </div>
  <div id="screen-finished" class="panel" style="display:none">
    <p id="finishedMsg" style="text-align:center;font-size:20px;font-weight:900"></p>
  </div>
  <button id="chatToggleBtn" class="chat-fab" onclick="toggleChatPopup()">💬</button>
  <div id="chatPopup" class="chat-popup" style="display:none">
    <div class="chatbox" id="chatBox"></div>
    <div class="chat-row">
      <input id="chatInput" placeholder="پیام...">
      <button onclick="sendChat()">ارسال</button>
    </div>
  </div>
</div>
<script>
// همان دامنه‌ی سرور؛ نیازی به تغییر نیست
const BACKEND_URL = "";
const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) tg.expand();
let userId, userName, roomCode, pollTimer;
let trickKey = "", handKey = "", lastTrickN = 0, lastTurnMe = false, muted = false, actx = null;
let selectedPlayers = 4, selectedScore = 7;
let roundEndKey = "";
let trumpHandKey = "";
let trickRenderedPids = new Set();
let lastChatCount = 0;
let lastStatus = "", lastHandLen = -1, lastState = null;
let dealing = false, dealPending = false, dealTimers = [], dealAnims = [];
let chatBubbles = {}; // relative seat index -> {text, until}
let chatPopupOpen = false;
tryAutoStart();
function toggleChatPopup(){
  chatPopupOpen = !chatPopupOpen;
  document.getElementById("chatPopup").style.display = chatPopupOpen ? "block" : "none";
}
function tgUser() {
  if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) return tg.initDataUnsafe.user;
  return null;
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
/* ---- صدا ---- */
function beep(f, d, t){
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = t||"sine"; o.frequency.value = f;
    g.gain.setValueAtTime(.15, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + d);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + d);
  } catch(e){}
}
function toggleMute(){
  muted = !muted;
  document.getElementById("muteBtn").textContent = muted ? "🔇" : "🔊";
  const music = document.getElementById("bgMusic");
  if (music) music.muted = muted;
}
function show(id) {
  ["screen-name","screen-lobby-choice","screen-lobby","screen-trump","screen-game","screen-round-end","screen-finished"]
    .forEach(s => document.getElementById(s).style.display = (s===id ? "block":"none"));
}
function selectPlayers(n){
  selectedPlayers = n;
  document.querySelectorAll('.opt-btn[data-players]').forEach(b=>b.classList.toggle('active', Number(b.dataset.players)===n));
}
function selectScore(n){
  selectedScore = n;
  document.querySelectorAll('.opt-btn[data-score]').forEach(b=>b.classList.toggle('active', Number(b.dataset.score)===n));
}
function proceedFromName() {
  beep(520,.08);
  const tu = tgUser();
  const name = document.getElementById("nameInput").value.trim() || (tu ? tu.first_name : "بازیکن");
  startWithName(name);
}
function startWithName(name) {
  const tu = tgUser();
  userId = tu ? String(tu.id) : (localStorage.getItem("hokm_uid") || String(Date.now()));
  if (!tu) { try { localStorage.setItem("hokm_uid", userId); } catch(e){} }
  userName = name;
  try { localStorage.setItem("hokm_name", userName); } catch(e){}
  const music = document.getElementById("bgMusic");
  if (music) { music.volume = 0.35; music.play().catch(()=>{}); }
  show("screen-lobby-choice");
  const startParam = tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param;
  if (startParam && startParam.startsWith("hokm_")) {
    document.getElementById("joinCodeInput").value = startParam.replace("hokm_","");
    joinRoom();
  }
}
function tryAutoStart() {
  let saved = null;
  try { saved = localStorage.getItem("hokm_name"); } catch(e){}
  const tu = tgUser();
  if (saved) startWithName(saved);
  else if (tu && tu.first_name) startWithName(tu.first_name);
}
async function api(path, method="GET", body=null) {
  const opts = {method, headers:{"Content-Type":"application/json"}};
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(BACKEND_URL + path, opts);
  const data = await res.json();
  if (!res.ok) throw data;
  return data;
}
async function createRoom() {
  try {
    const data = await api("/api/create", "POST", {user_id:userId, name:userName, max_players:selectedPlayers, target_score:selectedScore});
    roomCode = data.code; enterLobby();
  } catch(e) { alert("خطا در ساخت اتاق"); }
}
async function joinRoom() {
  const code = document.getElementById("joinCodeInput").value.trim().toUpperCase();
  if (!code) return;
  try {
    await api("/api/join", "POST", {code, user_id:userId, name:userName});
    roomCode = code; enterLobby();
  } catch(e) { alert(e.error === "room_full" ? "اتاق پره" : "اتاق پیدا نشد"); }
}
function enterLobby() {
  document.getElementById("roomCodeText").textContent = roomCode;
  show("screen-lobby");
  startPolling();
}
function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(refreshState, 1500);
  refreshState();
}
async function refreshState() {
  try {
    const data = await api(`/api/state?code=${roomCode}&user_id=${userId}`);
    render(data.state);
  } catch(e) {}
}
function parseCard(card) {
  const suit = (card.match(/[♠♥♦♣]/)||["?"])[0];
  return {suit, rank: card.replace(suit,"").trim(), red: suit==="♥"||suit==="♦"};
}
function cardHtml(card, extra="", attrs="") {
  const c = parseCard(card);
  return `<div class="card ${c.red?"red":""} ${extra}" ${attrs}><span class="r">${c.rank}</span><span class="s">${c.suit}</span><span class="r2">${c.rank}</span></div>`;
}
function updateChatBubbles(state) {
  const chat = state.chat || [];
  if (chat.length > lastChatCount) {
    const newMsgs = chat.slice(lastChatCount);
    const myIdx = Math.max(0, state.players.findIndex(p=>p.id===userId));
    newMsgs.forEach(msg => {
      const pIdx = state.players.findIndex(p => p.name === msg.name);
      if (pIdx === -1) return;
      const relSeat = (pIdx - myIdx + state.players.length) % state.players.length;
      chatBubbles[relSeat] = {text: msg.text, until: Date.now() + 4500};
    });
  }
  lastChatCount = chat.length;
}
function render(state) {
  updateChatBubbles(state);
  if (state.status === "playing") {
    const grew = lastStatus === "playing" && lastHandLen >= 0 && state.hand.length > lastHandLen;
    if (((lastStatus && lastStatus !== "playing") || grew) && !prefersReduced()) dealPending = true;
    lastHandLen = state.hand.length;
  } else {
    lastHandLen = -1;
    if (dealing) cancelDeal();
  }
  lastStatus = state.status;
  if (state.status === "waiting") {
    show("screen-lobby");
    const maxP = state.max_players || 4;
    document.getElementById("lobbyInfo").textContent =
      `${state.players.length} از ${maxP} بازیکن — بازی تا ${state.target_score || 7} مچ`;
    document.getElementById("playersList").innerHTML =
      state.players.map((p,i) => `<li>${i%2?"🟠":"🟢"} ${esc(p.name)}</li>`).join("");
    document.getElementById("startBtn").style.display =
      (state.host === userId && state.players.length === maxP) ? "block" : "none";
  } else if (state.status === "choosing_hokm") {
    show("screen-trump");
    const buttons = document.querySelectorAll(".trump-picker button");
    const handArea = document.getElementById("trumpHandArea");
    if (state.hakem === userId) {
      buttons.forEach(b=>b.disabled=false);
      document.getElementById("trumpMsg").textContent = "شما حاکم این دست هستید! این کارت‌هاتونه — حکم رو انتخاب کن:";
      handArea.style.display = "flex";
      const hk = state.hand.join("|");
      if (hk !== trumpHandKey) {
        trumpHandKey = hk;
        handArea.innerHTML = state.hand.map((card,i) => cardHtml(card, "", `style="--i:${i}"`)).join("");
      }
    } else {
      buttons.forEach(b=>b.disabled=true);
      handArea.style.display = "none";
      handArea.innerHTML = "";
      trumpHandKey = "";
      const hakemName = (state.players.find(p=>p.id===state.hakem)||{}).name || "";
      document.getElementById("trumpMsg").textContent = `منتظر انتخاب حکم توسط ${hakemName}...`;
    }
  } else if (state.status === "playing") {
    show("screen-game");
    renderGame(state);
  } else if (state.status === "round_end") {
    show("screen-round-end");
    renderRoundEnd(state);
  } else if (state.status === "finished") {
    show("screen-finished");
    const myTeam = Math.max(0, state.players.findIndex(p=>p.id===userId)) % 2;
    const w = state.winner_team;
    const names = state.players.filter((p,i)=> i%2===w).map(p=>esc(p.name)).join(" و ");
    document.getElementById("finishedMsg").innerHTML =
      w == null ? "بازی تمام شد" : (w === myTeam ? "🎉 تیم شما برنده شد!" : "تیم حریف برنده شد") + `<br><small>${names}</small>`;
    if (trickKey !== "end") { trickKey = "end"; beep(w===myTeam?880:220,.5,"triangle"); }
  }
  renderChat(state.chat);
}
function renderRoundEnd(state) {
  const rr = state.round_result;
  if (!rr) return;
  const key = rr.win_team + "|" + rr.winners.join(",") + "|" + rr.losers.join(",");
  if (key === roundEndKey) return;
  roundEndKey = key;
  const myTeam = Math.max(0, state.players.findIndex(p=>p.id===userId)) % 2;
  document.getElementById("roundEndTitle").textContent =
    rr.win_team === myTeam ? "🎉 این دست رو بردید!" : "این دست رو باختید";
  document.getElementById("roundEndWinners").innerHTML =
    rr.winners.map(n => `<div>${esc(n)}</div>`).join("");
  document.getElementById("roundEndLosers").innerHTML =
    rr.losers.map(n => `<div>${esc(n)}</div>`).join("");
  beep(rr.win_team===myTeam?740:260,.35,"triangle");
}
function renderGame(state) {
  lastState = state;
  const players = state.players;
  const myIdx = Math.max(0, players.findIndex(p=>p.id===userId));
  const myTeam = myIdx % 2;
  const rel = pid => (players.findIndex(p=>p.id===pid) - myIdx + players.length) % players.length;
  const tb = document.getElementById("trumpBox");
  document.getElementById("trumpDisplay").textContent = state.trump;
  tb.className = "trumpbox" + ((state.trump==="♥"||state.trump==="♦") ? " red":"");
  document.getElementById("scMe").textContent = state.round_scores[myTeam];
  document.getElementById("scOpp").textContent = state.round_scores[1-myTeam];
  document.getElementById("trMe").textContent = "دست: " + state.tricks_won[myTeam];
  document.getElementById("trOpp").textContent = "دست: " + state.tricks_won[1-myTeam];
  const myTurn = state.turn === userId;
  const turnName = (players.find(p=>p.id===state.turn)||{}).name || "";
  document.getElementById("turnStatus").textContent = myTurn ? "نوبت شماست!" : `نوبت: ${turnName}`;
  if (myTurn && !lastTurnMe) { beep(660,.12); setTimeout(()=>beep(880,.12),130); }
  lastTurnMe = myTurn;
  for (let s=0; s<4; s++) document.getElementById("seat"+s).innerHTML = "";
  players.forEach((p,i) => {
    const s = rel(p.id);
    const team = i % 2 === myTeam ? 0 : 1;
    const b = chatBubbles[s];
    const bubbleHtml = (b && b.until > Date.now()) ? `<div class="bubble">${esc(b.text)}</div>` : "";
    document.getElementById("seat"+s).innerHTML =
      `<div class="av t${team} ${state.turn===p.id?"turn":""}">${state.hakem===p.id?'<span class="crown">👑</span>':""}${esc(p.name.charAt(0))}</div><div class="nm">${s===0?"شما":esc(p.name)}</div>${bubbleHtml}`;
  });
  const entries = Object.entries(state.trick);
  const tk = entries.map(([pid,c])=>pid+c).join("|");
  if (tk !== trickKey) {
    if (entries.length > lastTrickN) beep(300,.09,"square");
    lastTrickN = entries.length;
    trickKey = tk;
    const trickEl = document.getElementById("trick");
    // اگه دست جدیدی شروع شده (تعداد کارت‌ها کمتر از قبله یا صفره)، میز رو کامل خالی کن
    if (entries.length === 0 || entries.length < trickRenderedPids.size) {
      trickEl.innerHTML = "";
      trickRenderedPids = new Set();
    }
    // فقط کارت‌های جدید رو اضافه کن؛ کارت‌های قبلی رو دست نزن تا انیمیشنشون دوباره اجرا نشه
    entries.forEach(([pid, card]) => {
      if (!trickRenderedPids.has(pid)) {
        trickRenderedPids.add(pid);
        trickEl.insertAdjacentHTML("beforeend", cardHtml(card, `tc${rel(pid)} drop`));
      }
    });
  }
  const hk = state.hand.join("|") + (myTurn?"*":"");
  if (hk !== handKey && !dealing) {
    handKey = hk;
    const h = document.getElementById("handArea");
    h.className = "hand" + (myTurn ? " mine" : "");
    h.innerHTML = state.hand.map(card => cardHtml(card, "", `onclick="playCard('${card}')"`)).join("");
    if (dealPending) startDeal(state);
  }
  dealPending = false;
}
/* ---- انیمیشن پخش کارت بین بازیکن‌ها ---- */
function prefersReduced() {
  return !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
}
function cancelDeal() {
  dealTimers.forEach(clearTimeout); dealTimers = [];
  dealAnims.forEach(a => { try { a.cancel(); } catch(e){} }); dealAnims = [];
  const layer = document.getElementById("dealLayer");
  if (layer) layer.innerHTML = "";
  document.querySelectorAll("#handArea .card").forEach(c => c.style.visibility = "");
  dealing = false;
}
function finishDeal() {
  cancelDeal();
  if (lastState && lastState.status === "playing") { handKey = ""; renderGame(lastState); }
}
function startDeal(state) {
  const layer = document.getElementById("dealLayer");
  const cards = Array.from(document.getElementById("handArea").children);
  const players = state.players, n = players.length;
  if (!layer || !cards.length || !n || !layer.animate) return;
  dealing = true;
  cards.forEach(c => c.style.visibility = "hidden");
  const myIdx = Math.max(0, players.findIndex(p => p.id === userId));
  let first = players.findIndex(p => p.id === state.hakem);
  if (first < 0) first = 0;
  const per = cards.length, seq = [];
  for (let i = 0; i < per; i++) for (let j = 0; j < n; j++) seq.push({p:(first + j) % n, i});
  const step = Math.max(26, Math.min(70, 2000 / seq.length));
  const T0 = 300, DUR = 440;
  const f = document.getElementById("trick").getBoundingClientRect();
  const cx = f.left + f.width / 2 - 26, cy = f.top + f.height / 2 - 38;
  const deck = document.createElement("div");
  deck.className = "deal-deck";
  deck.style.left = cx + "px"; deck.style.top = cy + "px";
  deck.innerHTML = [0,1,2].map(k => `<i class="card-back" style="transform:translate(${k*2}px,${-k*2}px)"></i>`).join("");
  layer.appendChild(deck);
  dealAnims.push(deck.animate([{opacity:0, transform:"scale(.3)"},{opacity:1, transform:"scale(.72)"}], {duration:220, easing:"ease-out"}));
  seq.forEach((d, idx) => {
    dealTimers.push(setTimeout(() => {
      const rel = (d.p - myIdx + n) % n;
      let tx, ty, s1, r1;
      if (rel === 0) {
        const r = cards[d.i].getBoundingClientRect();
        tx = r.left + r.width / 2 - 26; ty = r.top + r.height / 2 - 38; s1 = r.width / 52; r1 = 0;
      } else {
        const seat = document.getElementById("seat" + rel);
        const r = (seat.querySelector(".av") || seat).getBoundingClientRect();
        tx = r.left + r.width / 2 - 26; ty = r.top + r.height / 2 - 38; s1 = .45; r1 = Math.random() * 40 - 20;
      }
      const from = `translate(${cx}px,${cy}px) scale(.72) rotate(${Math.random() * 16 - 8}deg)`;
      const to = `translate(${tx}px,${ty}px) scale(${s1}) rotate(${r1}deg)`;
      const el = document.createElement("div");
      el.className = "card-back deal-card";
      el.style.transform = from;
      layer.appendChild(el);
      const frames = rel === 0
        ? [{transform:from, opacity:1},{transform:to, opacity:1}]
        : [{transform:from, opacity:1},{transform:to, opacity:.9, offset:.8},{transform:to, opacity:0}];
      const a = el.animate(frames, {duration:DUR, easing:"cubic-bezier(.22,.8,.3,1)", fill:"forwards"});
      dealAnims.push(a);
      beep(rel === 0 ? 760 : 520, .03, "triangle");
      a.onfinish = () => {
        el.remove();
        if (!dealing) return;
        if (rel === 0) {
          const c = cards[d.i];
          c.style.visibility = "";
          c.animate([{transform:"scaleX(.1)"},{transform:"none"}], {duration:160, easing:"ease-out"});
        } else {
          const av = document.querySelector("#seat" + rel + " .av");
          if (av) av.animate([{transform:"scale(1)"},{transform:"scale(1.14)"},{transform:"scale(1)"}], {duration:150});
        }
      };
    }, T0 + idx * step));
  });
  const tLast = T0 + (seq.length - 1) * step;
  dealTimers.push(setTimeout(() => {
    dealAnims.push(deck.animate([{opacity:1},{opacity:0}], {duration:220, fill:"forwards"}));
  }, tLast));
  dealTimers.push(setTimeout(finishDeal, tLast + DUR + 250));
}
async function startGame() {
  try { await api("/api/start", "POST", {code:roomCode, user_id:userId}); }
  catch(e) { alert("خطا در شروع بازی"); }
}
async function chooseTrump(suit) {
  try { await api("/api/choose_trump", "POST", {code:roomCode, user_id:userId, suit}); }
  catch(e) { alert("فقط حاکم می‌تونه حکم رو انتخاب کنه"); }
}
async function playCard(card) {
  if (dealing) return;
  try { await api("/api/play", "POST", {code:roomCode, user_id:userId, card}); refreshState(); }
  catch(e) {
    beep(150,.2,"sawtooth");
    if (e.error === "must_follow_suit") alert("باید از خال " + e.suit + " بازی کنی!");
    else if (e.error === "not_your_turn") alert("نوبت شما نیست!");
    else alert("حرکت نامعتبر");
  }
}
async function sendChat() {
  const input = document.getElementById("chatInput");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  try { await api("/api/chat", "POST", {code:roomCode, user_id:userId, text}); } catch(e){}
}
function renderChat(chat) {
  if (!chat) return;
  document.getElementById("chatBox").innerHTML =
    chat.map(c => `<div><b>${esc(c.name)}:</b> ${esc(c.text)}</div>`).join("");
}
